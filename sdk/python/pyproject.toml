[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "weknora"
version = "0.7.27"
description = "Official Python SDK for the WeKnora Enterprise Knowledge Platform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "WeKnora SDK Team"}]
keywords = ["weknora", "rag", "knowledge-base", "sdk"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/weknora"]
